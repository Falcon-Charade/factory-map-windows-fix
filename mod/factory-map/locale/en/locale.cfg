[mod-setting-name]
factory-map-sweep-minutes=Web map: re-check everything every (minutes)
factory-map-chunks-per-tick=Web map: chunks per tick during a full refresh
factory-map-share-chat=Show chat on the website
factory-map-share-positions=Show where players are on the website
factory-map-record-attacks=Record enemy attacks for the website

[mod-setting-description]
factory-map-sweep-minutes=Building, mining and landfill show up on the website map within a minute or two anyway. This slow background check also catches ore being mined down, trees and biters spreading. On very big maps it takes longer than this, so it never costs more than a tiny bit of CPU.
factory-map-chunks-per-tick=Only used when the whole map is read in one go (after installing the mod or /map-refresh). Higher = finishes sooner but uses more CPU on every player's game until then.
factory-map-share-chat=Off: chat messages are not written out, so the website's event log never shows them.
factory-map-share-positions=Off: player positions are not written out. The website still shows who is online and their play time.
factory-map-record-attacks=Off: buildings destroyed by enemies are not recorded (no "Under attack" banner or attack map on the website).
